name: Publicar en GitHub Pages

on:
  push:
    branches: [claude/mira-system-oyfh42]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

# Permisos que necesita el despliegue a Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos commits seguidos, deja terminar el despliegue en curso
# y encola el siguiente, en vez de cancelarlo a media publicación.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Construir el sitio
        env:
          BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secretos VITE_SUPABASE_URL y/o VITE_SUPABASE_ANON_KEY."
            echo "::error::Agrégalos en Settings > Secrets and variables > Actions."
            exit 1
          fi
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
